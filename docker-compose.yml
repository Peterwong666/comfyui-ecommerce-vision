# ============================================================
# 本地开发中间件一键启动（P2-09 / P11-02）
#
# 包含：PostgreSQL 16 + Redis 7 + MinIO（S3 兼容对象存储）
# 不包含：ComfyUI（需要 GPU，见 docs/sop/quickstart.md）
#
# 用法：
#   docker compose up -d
#   cp .env.example .env   # 默认连接串已与本文件端口一致
#   cd backend && .venv/bin/python -m app.cli.init_db
#   cd backend && .venv/bin/python -m app.cli.seed_workflows
# ============================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: comfy-platform-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: platform
      POSTGRES_DB: platform
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform -d platform"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: comfy-platform-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-09-13T20-26-02Z
    container_name: comfy-platform-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  minio_data:

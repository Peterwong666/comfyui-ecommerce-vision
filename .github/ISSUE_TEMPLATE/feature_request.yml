name: 需求 / 能力建议
description: 提出新功能、新工作流或新场景需求
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 描述场景与痛点，而不是直接描述方案
    validations:
      required: true

  - type: dropdown
    id: scene
    attributes:
      label: 所属场景
      options:
        - 电商视觉 / 产品渲染
        - IP 形象一致性
        - 场景合成
        - AI 视频
        - 平台能力（任务/用户/素材/计费）
        - 工程与运维（性能/监控/部署）
        - 其他
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 涉及哪些工作流、节点、模型或平台模块

  - type: textarea
    id: acceptance
    attributes:
      label: 验收标准
      description: 如何判断做成了？请给出可量化的标准（良品率、耗时、成功率等）

  - type: dropdown
    id: version
    attributes:
      label: 建议排期
      options:
        - V1（当前版本内）
        - V2
        - V3
        - 未定，先进需求池
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案与取舍

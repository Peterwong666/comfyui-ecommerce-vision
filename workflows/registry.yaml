          default: 1.0
          min: 1.0
          max: 2.0
          step: 0.1
          group: "采样"
          advanced: true
          help: "蒸馏版必须为 1.0。调高不会「更听话」，只会让画面崩坏"
          targets:
            - node_id: "9"

# ---------------------------------------------------------------------------
# ⚠️ 「批量」为什么不是一条工作流（team-lead 2026-09-16 裁定）
#
# PRD FR-6.2 曾把「批量」与其余五条并列为「6 条标准工作流」（该计数已于 2026-09-17
# 按 docs/adr/0008-v1-scope-reduction.md 裁定 1 修正为「V1 5 条上线 + 1 条顺延 V2」），但实现上：
#   · 批量是 **对任意工作流的编排模式**：`POST /api/v1/batches` 按 SKU 拆成 N 个子任务
#   · 它的节点图与 `t2i_v1` **完全相同**
# 若登记成独立工作流，就会出现两份内容相同、版本却各自演进的 JSON —— 典型的「双真相」。
#
# 结论：批量由 **API 层**实现（FR-3.2 / 3.4 / 3.5 / 3.6 / 3.7），
# 在 PRD 与 API 文档里描述为「批量执行模式」，**不在本注册表中占位**。
#
# 注意不要与 `contracts.md` §3.6 的不变量混淆：那里的「单次执行只产出 1 张图」
# 说的是**一条工作流跑一次**只出一张；批量是通过父任务拆成 N 个**独立子任务**达成的，
# 每个子任务仍然各跑一次、各出一张。两者不矛盾。
# ---------------------------------------------------------------------------

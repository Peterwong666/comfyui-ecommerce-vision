  - id: flux2_klein_t2i_v1
    version: 1
    title: "FLUX.2 [klein] 4B Distilled 文生图"
    display_name: "文生图（极速）"
    description: >-
      第二底模，Apache-2.0 可商用。蒸馏版固定 4 步 / cfg=1，单张约 1.8s，
      适合高吞吐量产场景。klein 同时支持单/多参考图编辑，图生图链路将在 v2 复用它。
    definition: flux2_klein_t2i_v1.json
    engine: "ComfyUI v0.36.0 (commit ee71d5c4)"
    models:
      - flux-2-klein-4b.safetensors
      - flux2-vae.safetensors
      - qwen_3_4b.safetensors
    # ✅ L4（渲染路径）已于 2026-09-16 在真实 GPU 上通过 —— 见 verification_note
    status: enabled
    rollout_percent: 100
    verification: gpu_verified
    verification_note: >-
      **渲染路径 L4 已通过**（2026-09-16，RTX 4090，生产配置 --highvram，
      工具 engine/tools/verify_render_path.py，显式 seed=20260916）：
      通过 13 项 · 失败 0 · 跳过 0。覆盖：engine/render 渲染成功、
      targets 注入落点正确（含多 target 一致性）、**同一显式 seed 两次出图
      IDAT 逐字节一致**、写元数据未改动像素、wf_meta.seed 等于传入 seed、
      ComfyUI 自写的 prompt chunk 保留。
      ⚠️ 本项**不**证明画质（属 golden set）与性能达标（属稳态基准 #18）。
      历史：此前的 gpu_verified 仅指「**模板裸提交**已出图」，不含渲染路径。
    render_path_l4: true

    baseline:
      measured_at: "2026-09-16"
      engine: "ComfyUI v0.36.0"
      launch_args: "--highvram"
      resolution: 1024x1024
      steps: 4
      cfg: 1.0
      samples: 12
      warmup: 1
      min_s: 1.52
      median_s: 1.83
      p95_s: 2.67
      vram_peak_gb: 15.8
      nfr_target: "≤60s（PRD §7.2 P95 口径）"
      source: "项目进展.md #18 参考值 · #16 验证 5 ④"

    changelog:
      - version: 1
        date: "2026-09-16"
        change: >-
          首次进入注册表。节点图沿用 09-16 跑通的工作流（当时 id=WF-T2I-FLUX2-KLEIN、
          version=2.0.0），**节点图未做任何改动**；仅规范化 `_meta` 并补充参数 Schema。
        reason: >-
          P3-09 建立注册表。注意跨版本细节：此工作流**不是**"升级后改出来的"，
          而是因为 v0.3.75 物理上不支持 klein（#14）才在 v0.36.0 上首次建成。
        evidence:
          - "首次出图成功：#16 验证 5 ④（median 1.83s / P95 2.36s，4 步 / cfg=1）"
          - "生产配置复测：#18（--highvram，min 1.52s）"
          - "节点组合依据官方模板：#16 验证 3"
        affected: "B · A · D"

    notes: >-
      两个刻意的设计决定：
      (1) **不暴露 negative_prompt** —— 官方模板的 Distilled 子图用 ConditioningZeroOut
          把负向条件整体置零，此时任何负向提示词都不起作用。暴露一个"填了不起作用"的
          参数比不暴露更糟。
      (2) **不暴露 sampler_name / scheduler** —— 蒸馏版官方模板固定 euler + Flux2Scheduler，
          没有调优空间；少一个参数就少一处出错面。
      已知偏差同 t2i_v1：`filename_prefix` 仍为 `smoke/flux2_klein`，v2 修正。
      ⚠️ **本工作流的提示词严禁使用权重语法**（`(word:1.2)`）——
      `KleinTokenizer` 内部硬编码 `disable_weights=True`（源码级定论，见
      docs/sop/debug_log.md G7），权重不解析，且**括号/冒号/数字会作为字面 token
      喂进模型**，属于主动污染提示词。前端提示文案与提示词库都应据此说明。

      ⚠️ **提示词语法约束（给前端提示文案与提示词库用）**：klein 的 `KleinTokenizer`
      显式传 `disable_weights=True`，因此 **本工作流严禁使用权重语法 `(word:1.2)`** ——
      括号/冒号/数字会**原样进入分词**，属污染提示词，不是"写了无效"。
      完整依据见 docs/sop/debug_log.md G7。SDXL 的 t2i_v1 不受此限制。

    param_schema:
      schema_version: 1
      fields:
        - key: prompt
          label: "正向提示词"
          type: text
          # 与模板里 node 4.text 的字面值一致（规范 §5.5）
          default: >-
            professional product photo of a matte white ceramic coffee mug on a light
            grey seamless background, soft studio lighting, subtle shadow, sharp focus,
            centered composition, high detail, commercial e-commerce photography
          max_length: 2000
          group: "提示词"
          help: "klein 的文本编码器是 Qwen3-4B，**中文提示词同样可用**"
          targets:
            - node_id: "4"
              input: text

        - key: width
          label: "宽度"
          type: int
          default: 1024
          min: 512
          max: 2048
          step: 64
          group: "画布"
          help: "必须同时写入潜空间与 sigma 调度器，否则曲线按错误分辨率生成"
          # ⚠️ 多 target 是必须的，不是冗余：EmptyFlux2LatentImage 决定画布，
          #    Flux2Scheduler 决定 sigma 曲线。只写一个会"能出图但质量下降"，
          #    且难以归因（workflow_spec.md §5.1 记录的排查陷阱）
          targets:
            - node_id: "6"
              input: width
            - node_id: "7"
              input: width

        - key: height
          label: "高度"
          type: int
          default: 1024
          min: 512
          max: 2048
          step: 64
          group: "画布"
          targets:
            - node_id: "6"
              input: height
            - node_id: "7"
              input: height

        - key: seed
          label: "随机种子"
          type: seed
          default: -1
          group: "采样"
          help: "-1 表示随机。klein 走 RandomNoise 节点，入参名是 noise_seed"
          targets:
            - node_id: "8"
              input: noise_seed

        - key: steps
          label: "采样步数"
          type: int
          # 蒸馏版固定 4 步。上限压到 8 而不是 PRD 的 100：
          # Schema 的边界可以**比 settings 更严**（不能更宽），这里是有意收窄
          default: 4
          min: 1
          max: 8
          step: 1
          group: "采样"
          advanced: true
          help: "蒸馏版固定 4 步，调高无收益且会变慢。上限有意收窄到 8"
          targets:
            - node_id: "7"
              input: steps

        - key: cfg
          label: "CFG"
          type: float
          # 蒸馏版 cfg 必须为 1。上限压到 2.0：调高会破坏蒸馏结果
          default: 1.0
          min: 1.0
          max: 2.0
          step: 0.1
          group: "采样"
          advanced: true
          help: "蒸馏版必须为 1.0。调高不会「更听话」，只会让画面崩坏"
          targets:
            - node_id: "9"
              input: cfg


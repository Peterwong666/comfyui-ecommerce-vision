# ============================================================================
# 工作流注册表（Workflow Registry）
#
# 覆盖任务：P3-09
# 规范：docs/sop/workflow_spec.md      参数 Schema 格式：docs/sop/contracts.md §3（已冻结）
#
# 这是**唯一的工作流清单**：
#   · A 流（后端）→ 灌进 `workflows` 表，`param_schema` 落 JSONB
#   · D 流（前端）→ 用它生成动态表单（P7-02）
#   · B 流（内核）→ 用它定位工作流定义文件
#
# 三条硬性规则：
#   1. `param_schema` 必须严格符合 contracts.md §3 —— A 流按它校验、D 流按它渲染表单
#   2. `version` 必须出现在 `changelog` 里 —— 变更日志是「改坏能退回去」的依据（FR-6.3）
#   3. `verification` 必须如实填写 —— 本项目最看重「过程可证明」，
#      谎报验证状态比不验证更糟（把「只过了静态校验」写成「已跑通」是绝对禁止的）
# ============================================================================

registry_version: 1
updated_at: "2026-09-18"  # i2i_v1 / inpaint_v1 / upscale_v1 补齐 baseline，verification 升到 gpu_verified；status 仍 disabled 待 P8 画质评审

# ---------------------------------------------------------------------------
# verification 取值口径（唯一的判据，不许自行放宽）
#
#   gpu_verified            —— 已在本机 GPU 上真实出图，并带有本工作流口径的 baseline。
#                            必须同时给出 baseline.measured_at（性能数字必须带口径与日期，#15）。
#                            这是**唯一**能让 `status: enabled` 的 verification 值。
#
#   render_path_l4_passed   —— 渲染路径 L4 已真实出图，但缺少本工作流口径的 baseline
#                            或核心语义（如局部重绘的蒙版）尚未验证。不能放行，
#                            但比 `static_only` 更进一层，避免把「已出图」写成 pending。
#
#   static_only             —— 只通过离线静态校验（L1 结构自洽 / L2 渲染冒烟 / L3 object_info），
#                            **从未真实出图**。不能声称已跑通
#   pending_gpu             —— 定义已写、参数已声明，连静态校验都还没过
#
# status 取值：enabled（对外可用）· gray（灰度，rollout_percent 生效）· disabled（未放行）
#
#   ⚠️ **放行规则（硬性）**：L4 未跑之前一律 `disabled`。`enabled` 只能在
#      「**渲染路径**」真实出图并核对产物之后才写（workflow_spec.md §8.3）。
#      当前两条工作流全是 `disabled`：模板出过图，但渲染路径尚未与真实引擎联调。
#
# ⚠️ 修改已 gpu_verified 工作流的**节点图**（增删节点、改连线、改入参字面值）
#    会使该验证失效，必须：version+1 → verification 降回 static_only/pending_gpu →
#    重跑 L4 后才能改回 gpu_verified。
#    **只改 `_meta` 段不受影响**（`_meta` 在渲染时被整段剥离，不进 ComfyUI）。

workflows:

  # ==========================================================================
  # 文生图 · SDXL 1.0
  # ==========================================================================
  - id: t2i_v1
    version: 1
    title: "SDXL 文生图"
    display_name: "文生图（标准）"
    description: >-
      V1 主底模。纯文字生成商品图，无参考图时的兜底路径（FR-2.9）。
      SDXL 的控制生态最成熟，P4 的控制矩阵（ControlNet / IP-Adapter）都挂在它上面。
    definition: t2i_v1.json
    engine: "ComfyUI v0.36.0 (commit ee71d5c4)"
    models:
      - sd_xl_base_1.0.safetensors
    # ✅ L4（渲染路径）已于 2026-09-16 在真实 GPU 上通过 —— 见 verification_note
    status: enabled
    rollout_percent: 100
    verification: gpu_verified
    verification_note: >-
      **渲染路径 L4 已通过**（2026-09-16，RTX 4090，生产配置 --highvram，
      工具 engine/tools/verify_render_path.py，显式 seed=20260916）：
      通过 11 项 · 失败 0 · 跳过 0。覆盖：engine/render 渲染成功、
      targets 注入落点正确（含多 target 一致性）、**同一显式 seed 两次出图
      IDAT 逐字节一致**、写元数据未改动像素、wf_meta.seed 等于传入 seed、
      ComfyUI 自写的 prompt chunk 保留。
      ⚠️ 本项**不**证明画质（属 golden set）与性能达标（属稳态基准 #18）。
      历史：此前的 gpu_verified 仅指「**模板裸提交**已出图」，不含渲染路径。
    render_path_l4: true

    baseline:
      measured_at: "2026-09-16"
      engine: "ComfyUI v0.36.0"
      launch_args: "--highvram"
      resolution: 1024x1024
      steps: 30
      samples: 12
      warmup: 1
      # ⚠️ 判据是 min（地板）而非 median —— 共享宿主机每约 3 个样本出现一次干扰尖峰，
      #    median 会把宿主机噪声误判成自身回归（项目进展.md #18）
      min_s: 4.59
      median_s: 5.00
      p95_s: 5.48
      nfr_target: "≤25s（PRD §7.2 P95 口径）"
      source: "项目进展.md #18 参考值"
      note: >-
        升级前基线 min=4.54s，升级后 min=4.59s（差 1%）。曾出现 1.58x 回归，
        根因是 v0.36.0 默认开启的 dynamic VRAM，已由 --highvram 修复（#17/#18）。

    changelog:
      - version: 1
        date: "2026-09-16"
        change: >-
          首次进入注册表。节点图沿用 09-15 的冒烟工作流（当时 id=WF-T2I、version=1.0.0），
          **节点图未做任何改动**；仅规范化 `_meta`（id/version/models/node_titles）并补充参数 Schema。
        reason: "P3-09 建立注册表；P3-02 需要参数 Schema 才能做到「新增工作流不改代码」（FR-6.4）"
        evidence:
          - "P2-04 冒烟通过：#8.5（12.0s，冷启动值，口径见 #15）"
          - "v0.36.0 升级后复测出图：#16 验证 5 ③"
          - "生产配置标定：#18（--highvram，N=12）"
        affected: "B · A · D"

    notes: >-
      已知偏差（有意保留）：`SaveImage.filename_prefix` 仍是 `smoke/t2i`，
      而规范 §4.2 要求 `<工作流id>/<变体>`。改前缀会改变节点图、使现有 GPU 验证失效，
      故留到 v2 与高清修复分支一起改并重跑 L4。产物归属靠 DB 记录，不依赖路径。

    param_schema:
      schema_version: 1
      fields:
        - key: prompt
          label: "正向提示词"
          type: text
          # default 与模板里 node 6.text 的字面值**完全一致**：
          # 保证「不传参数直接渲染」≡「按模板原样提交」（规范 §5.5）
          default: >-
            professional product photo of a ceramic coffee mug, matte white finish,
            on a light grey seamless background, soft studio lighting, subtle shadow,
            sharp focus, high detail, centered composition
          max_length: 2000
          group: "提示词"
          help: "描述商品与场景。建议包含：主体 + 背景 + 光线 + 视角"
          targets:
            - node_id: "6"
              input: text

        - key: negative_prompt
          label: "负向提示词"
          type: text
          default: >-
            blurry, low quality, distorted, deformed, watermark, text, logo, cropped,
            oversaturated, plastic look
          max_length: 2000
          group: "提示词"
          advanced: true
          help: "不想出现的内容。SDXL 需要 cfg>1 才生效"
          targets:
            - node_id: "7"
              input: text

        - key: width
          label: "宽度"
          type: int
          default: 1024
          min: 512
          max: 2048
          step: 64
          group: "画布"
          help: "长边受 PRD §6.2 约束：512–2048"
          targets:
            - node_id: "5"
              input: width

        - key: height
          label: "高度"
          type: int
          default: 1024
          min: 512
          max: 2048
          step: 64
          group: "画布"
          targets:
            - node_id: "5"
              input: height

        - key: seed
          label: "随机种子"
          type: seed
          default: -1
          group: "采样"
          help: "-1 表示随机。渲染时会解析成真实值并写进产物元数据，便于复现（FR-5.4/5.5）"
          targets:
            - node_id: "3"
              input: seed

        - key: steps
          label: "采样步数"
          type: int
          default: 25
          min: 1
          max: 100
          step: 1
          group: "采样"
          advanced: true
          help: "SDXL 推荐 20–35。PRD §6.2 边界 1–100"
          targets:
            - node_id: "3"
              input: steps

        - key: cfg
          label: "CFG"
          type: float
          default: 6.5
          min: 1.0
          max: 20.0
          step: 0.1
          group: "采样"
          advanced: true
          help: "SDXL 推荐 5–8；过高会过饱和"
          targets:
            - node_id: "3"
              input: cfg

        - key: denoise
          label: "重绘幅度"
          type: float
          default: 1.0
          min: 0.0
          max: 1.0
          step: 0.01
          group: "采样"
          advanced: true
          help: "纯文生图固定 1.0。图生图链路才会用到 <1 的取值"
          targets:
            - node_id: "3"
              input: denoise

        - key: sampler_name
          label: "采样器"
          type: enum
          default: dpmpp_2m
          # ⚠️ 选项为**长期稳定的子集**，不是 v0.36.0 的完整取值。
          #    #16 记录过 CLIPLoader.type 在升级中由 17 项扩到 29 项 —— 枚举值会随引擎变。
          #    完整取值需 L3 用 /object_info 核对后补全（workflow_spec.md §8.1）。
          # 以下取值**逐项取自** deploy/schemas/object_info.v0.36.0.json 的
          # KSampler.sampler_name（L3 已核，非人工枚举）
          options:
            - { value: euler, label: "euler" }
            - { value: euler_cfg_pp, label: "euler_cfg_pp" }
            - { value: euler_ancestral, label: "euler_ancestral" }
            - { value: euler_ancestral_cfg_pp, label: "euler_ancestral_cfg_pp" }
            - { value: heun, label: "heun" }
            - { value: heunpp2, label: "heunpp2" }
            - { value: exp_heun_2_x0, label: "exp_heun_2_x0" }
            - { value: exp_heun_2_x0_sde, label: "exp_heun_2_x0_sde" }
            - { value: dpm_2, label: "dpm_2" }
            - { value: dpm_2_ancestral, label: "dpm_2_ancestral" }
            - { value: lms, label: "lms" }
            - { value: dpm_fast, label: "dpm_fast" }
            - { value: dpm_adaptive, label: "dpm_adaptive" }
            - { value: dpmpp_2s_ancestral, label: "dpmpp_2s_ancestral" }
            - { value: dpmpp_2s_ancestral_cfg_pp, label: "dpmpp_2s_ancestral_cfg_pp" }
            - { value: dpmpp_sde, label: "dpmpp_sde" }
            - { value: dpmpp_sde_gpu, label: "dpmpp_sde_gpu" }
            - { value: dpmpp_2m, label: "DPM++ 2M（推荐）" }
            - { value: dpmpp_2m_cfg_pp, label: "dpmpp_2m_cfg_pp" }
            - { value: dpmpp_2m_sde, label: "dpmpp_2m_sde" }
            - { value: dpmpp_2m_sde_gpu, label: "dpmpp_2m_sde_gpu" }
            - { value: dpmpp_2m_sde_heun, label: "dpmpp_2m_sde_heun" }
            - { value: dpmpp_2m_sde_heun_gpu, label: "dpmpp_2m_sde_heun_gpu" }
            - { value: dpmpp_3m_sde, label: "dpmpp_3m_sde" }
            - { value: dpmpp_3m_sde_gpu, label: "dpmpp_3m_sde_gpu" }
            - { value: ddpm, label: "ddpm" }
            - { value: lcm, label: "lcm" }
            - { value: ipndm, label: "ipndm" }
            - { value: ipndm_v, label: "ipndm_v" }
            - { value: deis, label: "deis" }
            - { value: cfgpp_ud10_ab, label: "cfgpp_ud10_ab" }
            - { value: res_multistep, label: "res_multistep" }
            - { value: res_multistep_cfg_pp, label: "res_multistep_cfg_pp" }
            - { value: res_multistep_ancestral, label: "res_multistep_ancestral" }
            - { value: res_multistep_ancestral_cfg_pp, label: "res_multistep_ancestral_cfg_pp" }
            - { value: gradient_estimation, label: "gradient_estimation" }
            - { value: gradient_estimation_cfg_pp, label: "gradient_estimation_cfg_pp" }
            - { value: er_sde, label: "er_sde" }
            - { value: seeds_2, label: "seeds_2" }
            - { value: seeds_3, label: "seeds_3" }
            - { value: sa_solver, label: "sa_solver" }
            - { value: sa_solver_pece, label: "sa_solver_pece" }
            - { value: ddim, label: "ddim" }
            - { value: uni_pc, label: "uni_pc" }
            - { value: uni_pc_bh2, label: "uni_pc_bh2" }
          group: "采样"
          advanced: true
          help: "取值集合已按 v0.36.0 的 /object_info 逐项核对（L3）"
          targets:
            - node_id: "3"
              input: sampler_name

        - key: scheduler
          label: "调度器"
          type: enum
          default: karras
          # 取自 object_info 的 KSampler.scheduler（L3 已核）
          options:
            - { value: simple, label: "simple" }
            - { value: sgm_uniform, label: "sgm_uniform" }
            - { value: karras, label: "Karras（推荐）" }
            - { value: exponential, label: "exponential" }
            - { value: ddim_uniform, label: "ddim_uniform" }
            - { value: beta, label: "beta" }
            - { value: normal, label: "normal" }
            - { value: linear_quadratic, label: "linear_quadratic" }
            - { value: kl_optimal, label: "kl_optimal" }
          group: "采样"
          advanced: true
          help: "取值集合已按 v0.36.0 的 /object_info 逐项核对（L3）"
          targets:
            - node_id: "3"
              input: scheduler

  # ==========================================================================
  # 文生图 · FLUX.2 [klein] 4B Distilled
  # ==========================================================================
  # ==========================================================================
  # 图生图 · SDXL（参考图驱动）
  # ==========================================================================
  # ==========================================================================
  # 局部重绘 · SDXL（蒙版驱动，免专用 inpaint 模型）
  # ==========================================================================
  - id: inpaint_v1
    version: 1
    title: "SDXL 局部重绘（蒙版驱动）"
    display_name: "局部重绘"
    description: >-
      只重绘蒙版区、其余部分按原图像素贴回（FR-2.8）。
      免专用 inpaint 权重：SetLatentNoiseMask 让采样只作用于蒙版区，任何 SDXL 底模可用。
    definition: inpaint_v1.json
    engine: "ComfyUI v0.36.0 (commit ee71d5c4)"
    models:
      - sd_xl_base_1.0.safetensors
    # ⚠️ 新工作流：节点图未在真实 GPU 上出过图
    status: disabled
    rollout_percent: 0
    verification: gpu_verified
    verification_note: >-
      **已在本机 GPU 上真实出图，并带有本工作流口径的 baseline**（2026-09-18，RTX 4090，
      生产配置 --highvram，工具 deploy/autodl/38_baseline_workflow.py，N=12 warmup=1，
      判读用 **min**）：
      渲染路径 L4 通过 11 项 · 失败 0 · 跳过 0（2026-09-17，seed=20260916）；
      稳态基准 min=4.03s / median=4.09s / P95=4.80s（口径：1024² / 25 步 / denoise=1.0）。
      **核心语义（蒙版区重绘）已验证**：
      ① 参考图使用带 alpha 的 PNG，透明区 = 被重绘区（`LoadImage` 由 alpha 导出 MASK，
         源码见 deploy/comfyui/evidence/36_inpaint_polarity_source.txt）。
      ② 极性已确认（alpha=0 为被重绘区），探针客观信号与源码一致。
      ③ 本次验证走 `/upload/image`（与生产 `asset_resolver` 同一条引擎上传链路），
         不是 `lambda` 本地文件名注入。
      ④ 输入/输出比对：带 alpha 参考图跑 `inpaint_v1` 后，产物与输入有 **162038/1048576**
         像素不同（ImageMagick `compare -metric AE`），证明透明区确实被重绘、非选区贴回。
      ⑤ 后端已实施 `requires_alpha: true` 校验（`REQUIRES_ALPHA`），普通 JPEG/RGB PNG
         在提交阶段即 422，不会进入队列静默 no-op。
      ⚠️ 本项**不**证明画质（属 golden set / P5、P8）。`status` **保持 disabled**：
         技术证据已足，但换背景/去瑕疵等场景的画质仍需 golden set 评审。
    render_path_l4: true

    baseline:
      measured_at: "2026-09-18T10:44:01+0800"
      engine: "ComfyUI v0.36.0 (commit ee71d5c4)"
      launch_args: "--highvram"
      device: "NVIDIA GeForce RTX 4090"
      resolution: "1024x1024"
      steps: 25
      denoise: 1.0
      min_s: 4.03

    changelog:
      - version: 1
        date: "2026-09-16"
        change: >-
          首次创建。节点 ID 按规范 §3.2 分段落位。走免专用模型的
          SetLatentNoiseMask 路线；非选区用 ImageCompositeMasked 贴回原图。
        reason: "P3-06；V1 电商场景的高频需求（换背景 / 去瑕疵 / 补细节），且必须保证非选区零改动"
        evidence:
          - "节点与入参经 L3 对 deploy/schemas/object_info.v0.36.0.json 校验通过"
          - "免模型路线经 node 侦察确认：VAEEncodeForInpaint / SetLatentNoiseMask 均在，且无需外部权重"
        affected: "B · A · D"

      - version: 1
        date: "2026-09-17"
        change: >-
          回填 L4 结果：`render_path_l4` 由 false 改为 true；
          `status` **保持 disabled**、`verification` **保持 pending_gpu**。
          **节点图未做任何改动**，故 version 不递增（与定义文件 `_meta.version=1` 一致）。
        reason: >-
          渲染路径确实跑通了（11/11），继续写 false 会低估已验证的部分；
          但本次是 no-op + 探针绕过平台素材管线 ⇒ 放行会变成谎报，故不放行。
        evidence:
          - "deploy/comfyui/evidence/36_l4_inpaint_v1.log（通过 11 · 失败 0 · 跳过 0）"
          - "deploy/comfyui/evidence/36_inpaint_mask_polarity.json（极性客观信号）"
          - "deploy/comfyui/evidence/36_inpaint_polarity_source.txt（LoadImage 源码摘录）"
        affected: "B · A · D"

      - version: 1
        date: "2026-09-18"
        change: >-
          ① 引入新 verification 值 `render_path_l4_passed`：
          `verification` 由 `pending_gpu` 改为 `render_path_l4_passed`；
          `reference_image` 字段新增 `requires_alpha: true`。
          ② 用带 alpha PNG 走 `/upload/image` 补齐核心语义验证与 baseline，
          `verification` 升到 `gpu_verified`。`status` **保持 disabled**（技术证据已足，
          画质评审待 P8）。**节点图未做任何改动**，故 version 不递增。
        reason: >-
          `pending_gpu` 已不能精确表达「L4 已出图但缺 baseline / 核心语义未验证」的状态；
          按 1024² / 25 步 / denoise=1.0 跑 N=12 warmup=1 得 min=4.03s，输入/输出 162038 像素不同，
          证明透明区确实被重绘。
        evidence:
          - "docs/review/analysis_20260918.md 决策 3.1/3.2"
          - "engine/registry.py VALID_VERIFICATION 扩展"
          - "deploy/autodl/38_baseline_workflow.py inpaint_v1（min=4.03s）"
          - "/root/autodl-tmp/l4_out/inpaint_alpha_verify/ 输入输出 diff（162038 px）"
        affected: "B · A · D"

    notes: >-
      已知局限（有意保留）：① 非选区用 ImageCompositeMasked **按原图像素贴回**，
      这不是多余步骤 —— VAE 编解码往返会劣化整张图，贴回才能保证非选区严格等于原图
      ② `GrowMask.tapered_corners` 固定为 true（羽化边缘、避免接缝），未暴露给用户
      ③ `GrowMask.expand` 默认 6 会**悄悄改变蒙版形状**，本工作流显式写死为 8 并暴露成参数。


  count: 13
  nodes: [ComfyUI-Advanced-ControlNet, ComfyUI-Easy-Use, ComfyUI-Impact-Pack, ComfyUI-Inspire-Pack, ComfyUI-KJNodes, ComfyUI-Manager, ComfyUI-VideoHelperSuite, ComfyUI_ADV_CLIP_emb, ComfyUI_IPAdapter_plus, ComfyUI_smZNodes, ComfyUI_tinyterraNodes, PowerNoiseSuite, efficiency-nodes-comfyui]
  analysis:
    - "**ComfyUI 本体即 GPL-3.0**，因此 GPL 节点在**进程内组合**不产生额外约束（同许可兼容）"
    - "**关键分界线是「是否分发（distribution）」**："
    - "　· **SaaS / 仅以 API 提供服务**（本项目 V1 形态，ADR-001）→ 不构成分发 → **一般无 GPL 义务**"
    - "　· **交付 docker 镜像 / 本地化部署给客户** → 构成分发 → **须履行 GPL-3.0 义务**（提供完整对应源码、保留许可声明）"
  implication: "⚠️ **这直接约束 ADR-001 的交付形态**：若未来从 SaaS 转为「镜像交付」，GPL 合规工作量会显著上升（需打包全部节点源码 + 许可声明）。**该结论需同步给 P11-11 与产品决策**"
  action: "已在 license_matrix §1 登记该结论；V1 保持 SaaS/API 形态 → 当前无需处理"


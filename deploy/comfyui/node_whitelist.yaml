      - "🚨 **已由 B 流用真实校验器 A/B 证伪「Power Lora Loader 可用」（`debug_log.md` G8）**：<br>`Power Lora Loader (rgthree)` 在 `object_info` 里 **`required=[]`、`optional=['model','clip']`** —— LoRA 条目是**动态 widget 属性**，不是声明式入参 → 注入 `lora_1` 直接被拒（`入参 'lora_1' 不被该节点接受（可选: ['clip','model']）→ VALIDATE=FAIL`）。<br>**这不是「属性可能访问不到」，而是「LoRA 参数压根没有可注入的入参」** → 本节点**无法**承担 P4-04 的多 LoRA 注入"
      - "✅ **但 keep 判定仍然成立 —— 理由需要换**：同一包内 **`Lora Loader Stack (rgthree)`** 的 `required=['model','clip','lora_01','strength_01','lora_02','strength_02','lora_03','strength_03','lora_04','strength_04']` —— **10 个全是声明式入参，完全可注入**。另有 `Seed` / `KSampler Config` / `Image Resize` / `Image Comparer` / `Power Prompt`（`required=['prompt']`）等可注入节点"
      - "⭐⭐ **选它的核心理由是「Schema 稳定性」，不只是「支持 4 个 LoRA」**（team-lead 指出要点，必须写清）：<br>`Lora Loader Stack` 把 LoRA 数量**固定为 4 个槽位** → **参数 Schema 不随模板变**。<br>对比串链核心 `LoraLoader` 的方案：<br>· **4 个节点 + 需自建 3 条连线**；<br>· **增删 LoRA 数量会改变链长 → 工作流 JSON 变 → 参数 Schema 的 targets 必须跟着改**；<br>· 而契约 §3 的设计目标是「**一个 Schema 驱动前端表单**」—— Schema 一变，前端表单、后端校验、埋点口径都要跟着动。<br>→ 因此**槽位固定**的价值在于**把模板演进与 Schema 解耦**：将来多用一个 LoRA 只是**改取值**（`lora_03` 从 `None` 换成文件名），**不改结构**。这才对上契约 §3 的分工。<br>· 代价：硬上限 4 个 LoRA。V1 的 FR-8.5 是 Should 级，够用"
      - "🔧 **处置（修正后）**：P4-04 的多 LoRA 走 **`Lora Loader Stack`（单节点、4 LoRA 槽位、可注入、Schema 稳定）**，而非 B 流原计划的「核心 `LoraLoader` 串链 4 个」；更**不要**用 `Power Lora Loader`。<br>本节点由 `keep` **维持 keep**，但保留理由从「Power Lora Loader」改为「**`Lora Loader Stack` 等可注入节点**」 —— 已通知 B 流，其 `debug_log.md` G8.1 已独立复核采纳（A/B 探针：`Lora Loader Stack` 的报错是**取值**不在允许集合，而非**入参名**不被接受 → 入参名全部有效）"
      - "💡 另一候选登记：`LoraLoaderModelOnly`（`required=['model','lora_name','strength_model']`，**无 clip**）—— 若将来只调模型不调文本编码器，它比 `LoraLoader` 更贴切"
      - "⚠️ **FR-8.5 的真实前置依赖不是节点选型，而是「有没有 LoRA 文件」**（B 流 G8.1 指出）：`object_info` 里 `LoraLoader.lora_name` 的枚举**当前为空** → 服务器上一个 LoRA 权重都没有。**排查 FR-8.5 时先看模型，别在节点接线里绕**（下载 LoRA 还需过许可审查，见 license_matrix §5）"
      - "⚠️ 同时保留 Node 2.0 的渲染不兼容风险：我们**不经 UI 出图**（走 API 注入），故该风险主要影响人工调试体验，不影响生产链路 —— 但**若 P4-04 需要人工在 UI 里搭图，要留意卡顿与属性面板失效**"


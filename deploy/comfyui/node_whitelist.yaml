# ============================================================
# 2.1 keep 档的「可注入性审计」（C 流，基于 L3 object_info）
# ============================================================
# 动机：keep 档原先只过了「技术状态 ok」+「许可能商用」两轴。
#       但 B 流 G8 证明还有第三轴：**参数能否被 targets 注入**（见 policy.injectability_rule）。
#       一个节点可以两轴全绿、却在自动化链路上完全不可用。
# 方法：把每个 keep 节点的节点类，按其 python_module 归属聚合，统计 required 为空（= 只能靠 widget 交互）的类数。
injectability_audit:
  method: "按 python_module 前缀匹配节点类 → 统计 required 为空的类占比（required 空 = 无可注入入参）"
  caveat: "⚠️ 本审计是**粗筛**：① required 为空 ≠ 该节点完全无用（它可能经 optional 注入，如 rgthree `Context` 的 base_ctx/model/clip）② 占比高只说明「不能依赖它做参数注入」，具体到某条工作流仍需按节点类逐个核（用 policy.injectability_rule 的查法）"
  results:
    - {node: comfyui_controlnet_aux, classes: 64, non_injectable: 0, ratio: "0%"}
    - {node: ComfyUI-Advanced-ControlNet, classes: 43, non_injectable: 2, ratio: "4.7%"}
    - {node: ComfyUI_IPAdapter_plus, classes: 37, non_injectable: 0, ratio: "0%"}
    - {node: ComfyUI-Impact-Pack, classes: 197, non_injectable: 11, ratio: "5.6%"}
    - {node: masquerade-nodes-comfyui, classes: 22, non_injectable: 0, ratio: "0%"}
    - {node: ComfyUI_BiRefNet_ll, classes: 6, non_injectable: 0, ratio: "0%"}
    - {node: rgthree-comfy, classes: 24, non_injectable: 12, ratio: "⚠️ 50%"}
    - {node: ComfyUI-KJNodes, classes: 198, non_injectable: 3, ratio: "1.5%"}
    - {node: ComfyUI_essentials, classes: 85, non_injectable: 1, ratio: "1.2%"}
    - {node: ComfyUI-Custom-Scripts, classes: 13, non_injectable: 0, ratio: "0%"}
    - {node: ComfyUI-Manager, classes: "未匹配到节点类", non_injectable: "-", ratio: "-"}
  conclusion:
    - "✅ **9/11 个可匹配的 keep 节点，非注入比例 ≤6%** → 控制体系类节点（controlnet_aux / IPAdapter_plus / masquerade / BiRefNet）**全部 0%**，说明 P4 的关键路径在注入层面是干净的"
    - "⚠️ **`rgthree-comfy` 是唯一的例外（50%）** —— 它的「便利节点」大量是 widget 属性型。**实证后果就是 G8**。→ 已在 policy 与 rgthree 条目中处置：多 LoRA 改用可注入的 `Lora Loader Stack`"
    - "💡 **对 P4-04 的直接建议**：多 LoRA 优先用 `Lora Loader Stack (rgthree)`（10 个声明式入参、单节点 4 LoRA）而非串链核心 `LoraLoader`（4 个节点 + 需自建连线）。两者都可注入，前者 Schema 更简洁"
    - "ℹ️ `ComfyUI-Manager` 不注册节点类（未匹配到）→ 它**对节点图零影响**，是纯运维工具。这与「V1 上线后建议禁用」的判定一致（不影响任何工作流）"


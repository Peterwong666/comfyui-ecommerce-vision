    correction: "⚠️ **2026-09-16 前提更正（本条目由 keep 降为 review 的原因）** —— 原记「提示词权重语法 `(word:1.2)` **依赖它**」并据此判 keep，**该前提已被 B 流用 `object_info.v0.36.0.json` 证伪**：<br>· 该包**只提供 4 个节点**，全是 `BNK_` 前缀（`BNK_CLIPTextEncodeAdvanced` / `BNK_CLIPTextEncodeSDXLAdvanced` / `BNK_AddCLIPSDXLParams` / `BNK_AddCLIPSDXLRParams`）<br>· 两条工作流的 `class_type` 全量枚举里 **一个 `BNK_*` 都没有**<br>· 我们用的条件编码是**核心** `CLIPTextEncode`（`python_module=nodes`）→ 权重语法**是核心节点自带的能力**<br>详见 `docs/sop/debug_log.md` G7（含「先用 object_info 查该包提供哪些节点类」的方法论）"

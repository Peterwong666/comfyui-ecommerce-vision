# ============================================================
# ComfyUI 自定义节点白名单（P2-05）
#
# 背景：现环境有 32 个自定义节点，「太多太脆，需要裁剪」（todolist.md P2-05）。
#       升级到 v0.36.0 后已暴露 3 个节点的 import 级失效（项目进展.md #18）。
#       节点越多 → 依赖冲突面越大 → 升级破坏面越大 → 环境越不可复现（R2）。
#
# 本文件是**唯一事实来源**：禁用动作、重装流程、依赖处置都以此为准。
#
# 环境：ComfyUI v0.36.0（HEAD ee71d5c4）· torch 2.13.0+cu130 · RTX 4090
# 证据：deploy/comfyui/evidence/（2026-09-16 无卡模式只读采集，见该目录 README.md）
# 最后更新：2026-09-16
# ============================================================
schema_version: 1
updated: 2026-09-16

# ============================================================
# 0. 判定口径
# ============================================================
policy:
  decisions:
    keep: 保留 —— 在 V1 关键路径上，或为开发/运维必需，**且许可已核实为可商用**
    disable: 禁用 —— 已损坏 / 与 V1 无关 / **许可不可商用或未知**
    review: 待评估 —— 有潜在价值但当前无必需证据；**先禁用不删除**，待实测后决定

  # status 只描述「技术状态」，与 v1_path（业务相关性）解耦
  statuses:
    ok: 可用 —— **有 import 级实证**（审计日志 Import times 段列出且未标 IMPORT FAILED）
    broken: 损坏 —— **有 import 级失败实证**（审计日志含 traceback + IMPORT FAILED）
    unverified: 未验证 —— 无证据
  # ⚠️ 口径说明：ok 的强度是「**能 import**」，**不等于「功能正确」**。
  #    功能正确性需要出图级验证（属 P3 各工作流的 DoD），本文件不代为实现。
  #    32 个节点的 import 结果来源：deploy/comfyui/evidence/comfyui_cpu_audit.log

  # ⚠️ 裁剪原则：**禁用而不删除**
  #  理由：① 删除后无法快速回退（升级破坏面已证明存在，见 项目进展.md #16）
  #        ② 磁盘不是当前瓶颈（系统盘剩 11G / 数据盘剩 23G）
  #        ③ 禁用可逆、可审计；删除不可逆
  disable_mechanism:
    how: "把节点目录重命名为 <name>.disabled（ComfyUI 加载时跳过该目录）"
    verify: "⚠️ 待验证：需在 v0.36.0 上确认跳过规则（ComfyUI 跳过以 . 开头或以 .disabled 结尾的目录）"
    fallback: "若该规则不成立，改为在节点目录内放置 .disabled 文件（ComfyUI-Manager 约定）"
    must_check: "禁用后必须重启并确认 ① 目标节点类从 /object_info 消失 ② 节点类总数下降 ③ V1 关键节点仍在。<br>**基线口径**：当前 **2530**（`deploy/schemas/object_info.v0.36.0.json`，已复核）；升级前 2102（`evidence/object_info_v0.3.75_classnames.txt`）"

  dependency_rules:
    - "禁用节点**默认不卸载其 pip 依赖** —— 共享依赖（opencv / onnxruntime / pyyaml 等）被其它节点引用，卸载会连带破坏"
    - "**例外（且已有判例）**：C++ 扩展类依赖若 ABI 失配，其坏 .so 会毒化整条导入链 → **应卸载**。#16 处置 10 卸载 flash-attn 是首个判例；本文件 §3 的 sageattention 是同类漏网项"
    - "任何 pip 变更后必须重跑 deploy/autodl/23_cpu_mode_node_audit.sh（CPU 模式，不耗 GPU）+ 26_validate_workflow.py"

  license_rules:
    - "**可通过**：MIT / Apache-2.0 / BSD —— 可保留"
    - "**GPL-3.0**：技术上可保留（ComfyUI 本体即 GPL-3.0），但**构成商业模式约束**，见 §4"
    - "**非商用（NC）**：一律禁用，无论技术状态如何"
    - "**仓库内无 LICENSE 文件**：按「未知即不用」处理 → 禁用，待上游仓库页面核实后方可回落"
    - "许可来源：节点仓库内 LICENSE* 文件首行（原始输出见 evidence/custom_nodes_licenses.txt）"

  # ==========================================================
  # ⭐ 可注入性判据（白名单的第四条轴，来源：B 流提出 + C 流用 L3 量化）
  # ==========================================================
  injectability_rule:
    rule: "**只有出现在 `object_info` 的 `required ∪ optional` 里的入参，才能被参数 Schema 的 `targets` 注入驱动。**"
    why: "本平台的自动化链路是「后端把参数注入工作流 JSON 再提交」。凡把参数藏在 **widget 属性**（而非声明式入参）里的节点，外部 API 驱动不了它 —— 它在交互式 UI 里好用，但在我们的链路里**等于不可用**。"
    how_to_check: |
      python -c "import json;d=json.load(open('deploy/schemas/object_info.v0.36.0.json'));\
      print(list(d['<节点类名>']['input'].get('required',{})), list(d['<节点类名>']['input'].get('optional',{})))"
    first_case: "**判例 G8**（`debug_log.md`）：`Power Lora Loader (rgthree)` 的 `required=[]`、`optional=['model','clip']` —— **LoRA 条目是动态 widget，没有可注入的入参** → `targets` 写 `lora_1` 被校验器拒绝（VALIDATE=FAIL）。详见本文件 rgthree 条目"
    implication_for_whitelist: "⚠️ 这条轴**独立于**技术状态（ok/broken）与许可（MIT/GPL）—— 一个节点可以三点全绿却在我们的链路上不可用。**keep 档的判定必须同时过这一轴**（见 §2.1 的可注入性审计）。"
    scope: |
      ⚠️ **适用范围（重要，勿误推）**：这条轴**只对「需要被参数驱动」的节点生效**。
      它**不适用于**安装/运维类工具 —— 典型是 `ComfyUI-Manager`：它**不注册任何节点类**，
      对节点图零影响，走的是**另一类判定**（运维价值 + 安全面 + V1 上线后是否还需要）。

      ❌ **错误推理路径（务必避免）**：「Manager 的类数 = 0 → 不可注入 → 应当禁用」。
      这个推理每一步都错：Manager 的 0 类**不是因为参数被藏起来**，而是它**根本不参与出图**；
      它从不需要被 `targets` 注入。它的禁用理由是「V1 环境冻结后不再需要安装新节点的能力 +
      它能执行任意 pip/git 操作的安全面」——**与可注入性无关**。

      ✅ **正确用法**：先问「这个节点是否需要作为图的一部分被参数驱动？」
      · 需要 → 用本轴判定（`required ∪ optional` 是否覆盖你要注入的参数）
      · 不需要（运维/UI/安装类）→ 用「运维必需性 + 安全面 + 时机」判定
    source: "B 流（stream-b-workflow）在 G8 中提出并给出查法；C 流用 `deploy/schemas/object_info.v0.36.0.json`（L3，2530 节点）完成量化；team-lead 补充「适用范围」这一节"

  # ==========================================================
  # ⭐ 架构性反模式（本轮 review 收敛提炼出的可复用判据）
  # ==========================================================
  # 与 injectability_rule 互补：那条是「查得出来的硬判据」，这条是「看设计就知要避开的模式」。
  # 关键区别：以下两个节点**技术状态 ok、许可也干净**（MIT / GPL-3.0），
  #           禁用它们纯粹是**架构理由** —— 说明白名单不能只看"能不能跑、能不能商用"。
  architectural_anti_patterns:
    - pattern: "**把参数藏进 widget 属性**"
      example: "`ComfyUI-Easy-Use`（一键封装，隐藏真实节点结构）；`Power Lora Loader (rgthree)`（LoRA 藏进动态 widget）"
      why: "与 `contracts.md` §3.3「`targets` 必须指向真实存在的节点与入参」冲突 —— 后端注入不到，等于不可用（判例 G8）"
      verdict: "出图链路上**禁用**"
    - pattern: "**把参数藏进提示词文本**"
      example: "`ComfyUI-Coziness`（`<lora:name:1.1>` 内联语法）"
      why: "这些参数**绕过后端二次校验**（`contracts.md` §3.4），且产物元数据无法结构化记录「用了哪些 LoRA / 权重多少」→ 破坏 FR-5.4 可复现性"
      verdict: "出图链路上**禁用**"
    - pattern: "**「一键封装」式聚合层**"
      example: "`ComfyUI-Easy-Use`（200 类）；同类风险：`efficiency-nodes-comfyui`（40 类，已据此收紧其用途，仅保留 P3-04 一个具名用途）"
      why: "封装越厚，节点图与参数 Schema 的对应关系越间接；模板演进会连带 Schema 变更（对比 `Lora Loader Stack` 的「固定槽位 → 结构不变」优势）"
      verdict: "无具名必需用途时**不保留**"
    - general_rule: "→ **「把参数藏起来」的节点在自动化链路上都是负资产，即使它技术完好、许可干净。**<br>这是本项目与「交互式 ComfyUI 用户」的**根本取向差异**：UI 用户追求省事，本平台追求**可注入、可校验、可复现**。"


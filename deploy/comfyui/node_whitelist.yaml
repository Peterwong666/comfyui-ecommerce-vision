# 3. ⚠️ 环境级缺陷：sageattention（非节点，但导致节点失效）
# ============================================================
environment_defects:
  - id: ENV-01
    title: "sageattention==2.2.0 的坏 .so 毒化整条 diffusers 导入链"
    severity: 中（导致 1 个节点失效 + 1 个节点叠加报错，并掩盖了真实根因）
    status: 待处置
    evidence:
      - "evidence/comfyui_cpu_audit.log:192-260 —— 完整调用链：diffusers/models/transformers/transformer_flux.py:29 → attention_dispatch.py:72 → from sageattention import ... → sageattention/quant.py:20 → from . import _fused → ImportError: ..._fused.cpython-312-x86_64-linux-gnu.so: undefined symbol: _ZN3c106detail14torchCheckFailEPKcS2_jRKSs"
      - "evidence/comfyui_cpu_audit.log:430 —— `Could not load sageattention: ... undefined symbol`（ComfyUI 侧也已放弃它）"
      - "deploy/versions.lock [pip] 段仍含 `sageattention==2.2.0` 与 `spas_sage_attn==0.1.0` → **它没有被卸载**"
    analysis: |
      sageattention 是针对 **torch 2.5.1** 编译的 C++ 扩展，torch 升到 2.13.0 后 libtorch ABI 已变
      （同类报错在 flash-attn 上出现过）。而 diffusers 的 attention_dispatch 在**模块级无条件 import 它**
      → 只要它装着且损坏，**任何 import diffusers 的节点都会失败**
      （当前受害者：ComfyUI_smZNodes、ComfyUI-nunchaku 的第一层报错）。
    hypothesis: "**卸载 sageattention 后，ComfyUI_smZNodes 很可能恢复**（diffusers 导入链不再被毒化）"
    precedent: "项目进展.md #16 处置 10：卸载 flash-attn（同类 ABI 失配）后 4 个模块恢复。**sageattention 是同一类问题的漏网项** —— 当时只「回退使用」而未卸载"
    proposed_action:
      - "① 先**备份** `pip freeze` 与 sageattention 的 wheel 路径（便于回滚）"
      - "② `pip uninstall sageattention spas_sage_attn`"
      - "③ 在 **CPU 模式**重跑 23_cpu_mode_node_audit.sh，确认：diffusers 导入恢复、smZNodes 是否恢复、其余节点无回退"
      - "④ 复测 26_validate_workflow.py（两条工作流必须仍 PASS）"
      - "⑤ 更新 deploy/versions.lock（sageattention 从 [pip] 消失属**预期变更**，需记录原因）"
    risk: "低 —— 它当前**已被 ComfyUI 放弃**（日志明示 load 失败），且性能侧从未启用（#17 已证明注意力后端自始至终是 `Using pytorch attention`）→ 卸载是纯收益"
    owner: "C 流（环境）／需 GPU 侧复测时通知团队负责人"


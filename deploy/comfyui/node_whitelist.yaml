# ============================================================
# 7. 许可分类的独立第二来源交叉验证（C 流，2026-09-16）
# ============================================================
# 动机：§2 的许可统计来自「服务器读各仓库 LICENSE* 原文」这一个来源。
#       单一来源若读错（例如 grep 到 README 里的许可提及、或读到上游而非仓库自身），
#       整张表都会错 —— 而它直接决定白名单的禁用档，代价是法律风险。
#       故用 GitHub License API（/repos/{owner}/{repo}/license，读 GitHub 的检测结果）
#       独立跑一遍 32 个节点，两个来源互不依赖。
license_cross_validation:
  method:
    primary: "服务器端读取各节点目录内 LICENSE* 文件首行（evidence/custom_nodes_licenses.txt）"
    secondary: "GitHub License API → license.spdx_id（C 流本地执行，不连服务器）"
  result:
    MIT: {primary: 10, secondary: 9, agree: "✅ 差 1 项为 ComfyUI_BiRefNet_ll（API 报 NOASSERTION，原文为 MIT）"}
    Apache-2.0: {primary: 5, secondary: 5, agree: "✅ 完全一致"}
    GPL-3.0: {primary: 13, secondary: 13, agree: "✅ 完全一致（含 IPAdapter_plus / Impact-Pack / KJNodes 等 keep 档节点）"}
    无LICENSE文件: {primary: 3, secondary: 3, agree: "✅ **指名逐条一致**：Derfuu / comfyui-browser / comfyui-supersave"}
    NC许可: {primary: "1（Upscaler-Tensorrt = CC BY-NC-SA 4.0）", secondary: "1 报 NOASSERTION", agree: "✅ 可对上（NOASSERTION 正说明是非标准/自定义条款）"}
    total: {primary: 32, secondary: 32, agree: "✅ 无遗漏、无多出"}
  conclusion: "两个独立来源**逐条吻合** → §2 的许可统计可以采信，禁用档的判定依据成立。"
  methodology:
    - "⭐ **API 适合「批量筛查 + 交叉验证」，原文才行「判定」** —— 二者不可互相替代。"
    - "⚠️ **`NOASSERTION` 里藏着红线**：`ComfyUI-Upscaler-Tensorrt` 的 CC BY-NC-SA 4.0 在 API 侧只表现为 `NOASSERTION`。**只信 API 就会漏掉这个非商用节点**。API 报 NOASSERTION/空 → 必须回落读原文。"
    - "这与本项目「未知即不用」是同一逻辑：**没读到原文就等于未知**。"
    - "副产品：`ComfyUI_BiRefNet_ll` 反向印证了该纪律 —— API 报 NOASSERTION，原文是标准 MIT，**只信 API 会把它误判为「需进一步核实」而白耗时间**。"


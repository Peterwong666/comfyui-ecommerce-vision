    findings:
      - "**dirty=1** —— 工作区有未提交改动，需查明并记录（否则环境不可复现）"
      - "⭐ **正确定位（team-lead 2026-09-16 确认）：它不是「可能没用的遗留物」，而是「klein 权重支持的可选方案，V1 暂不启用」** ——<br>关键机制差异：klein 的核心 `CLIPTextEncode` 走 `KleinTokenizer`，而后者**硬编码 `disable_weights=True`**（不解析权重）；而 `BNK_*` 节点是**自己解析权重并生成加权 embedding** 的（`weight_interpretation` 5 种语法）→ **不依赖 tokenizer 的 `disable_weights`，也不需要 `cfg > 1`**"
      - "🔶 **但机制上并不保证有效 —— 这是 G7 待验证 ③ 的开放问题，且存在反例机制**：`KleinTokenizer` 内部硬编码 `disable_weights=True`，因此**任何**调用 `clip.tokenize*()` 的节点（含 `BNK_*`）拿到的都可能是**已丢弃权重**的 token 序列 —— 除非该节点自己重新解析并把权重直接作用到 embedding。<br>→ **故不能预期它有效**；实测它的价值在于：**若无效，「klein 支持权重」这条路即被证伪，不必再投入**（`debug_log.md` G7）"
    convergence: "**保留 review（收敛后仅剩 2 个 review，本项为其中之一）—— 且是「有计划的保留」，不是「待定」**。<br>① 可注入性：**4 类全部可注入**（`required` = `text`/`clip`/`token_normalization`/`weight_interpretation` 全为声明式入参）✅<br>② 不在 V1 关键路径（`v1_path: false`）：接线对 V1 **零功能影响**<br>③ ⚠️ **明确不按「review 一律禁用」处理** —— 那会为规则一致性丢掉一个**真正的备选方案**，还多一次改名-改回的开销（team-lead 指示）"
    lean: "**保持 review** —— 若 P4 决定为 klein 启用权重语法（G7 待验证 ③ 通过），此项**回到 keep 并接线**；否则维持现状（不禁用）"


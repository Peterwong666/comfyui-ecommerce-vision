      **当前零 LoRA 资产**（B 流 G8.1 实测：`LoraLoader.lora_name` 枚举为空）。因此 FR-8.5 的
      **真实前置依赖是「先下载 LoRA + 过许可审查」，不是「选对节点」**。
      下游若要用 `Lora Loader Stack (rgthree)`（已选定方案，4 槽位固定、可注入、Schema 稳定），
      必须先有 LoRA 文件 —— 连 `None` 占位都只能验证「不报错」，无法验证「权重生效」。
    v1_policy: |
      ⚠️ **V1 的合规最优解是「完全不含第三方 LoRA」**（license_matrix.md §5）：
      LoRA 是风险最高的一类资产（Civitai 大量条目禁商用/禁转售），而 FR-8.5 只是 Should 级。
      **建议 V1 只走「自训练」路线（E6）；在自训练闭环建成前，不引入第三方 LoRA。**
      这既避开许可风险，也不阻塞任何 Must 级功能。
    how_to_fill: "① 先定 V1 是否真需要 LoRA（可由 team-lead 拍板）② 需要则按 license_matrix §5 的 5 条最小检查表逐个筛选 ③ 登记本表后才可进交付链路"


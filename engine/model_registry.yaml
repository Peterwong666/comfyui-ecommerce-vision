# ---------- 字段约定 ----------
#   name             注册表内唯一标识（= 磁盘文件名，不含扩展名时以 file_path 为准）
#   kind             ModelKind 枚举取值：checkpoint/unet/vae/text_encoder/lora/controlnet/ipadapter/upscale/other
#   version          版本号（同 name 多版本共存时用于回滚，P5-07）
#   file_path        数据盘绝对路径（软链进 ComfyUI models 目录，配置外置 NFR-6）
#   file_size        字节数（引用 versions.lock，不重算）
#   sha256           引用 versions.lock，M2「销毁重建仍可复现同图」的锚点
#   source           {repo, url, channel, note} 来源与下载渠道
#   license          {name, url, commercial_ok, verified, note}
#                    commercial_ok: true / false / unknown  ←**unknown 一律不得启用**
#                    verified: 是否已核对 LICENSE 原文（false = 待核实）
#   eval             {score, good_rate, notes}  —— P5-02 评测后回填；未评测为 null
#   status           active 启用 / standby 备用 / disabled 禁用 / pending_eval 待评测
#   vram             {gb, basis} 显存占用；basis: measured 实测 / estimated 估算
#   is_default       该 kind 下的默认项（同一 kind 至多一个 true）
#   sort_order       展示排序
#   extra            追加信息（量化方式、性能基线、关联工作流等）
#
# ---------- 磁盘布局 ----------
# 数据盘根：/root/autodl-tmp/comfyui-data/models

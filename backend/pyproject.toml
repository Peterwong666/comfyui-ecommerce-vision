[project]
name = "comfyui-platform-backend"
version = "0.1.0"
description = "电商视觉 AIGC 量产平台 · 后端服务"
requires-python = ">=3.10"
dependencies = [
    # Web 框架
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
    # 配置与校验
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    # `app/schemas/user.py` 用了 `EmailStr`，而 pydantic 校验邮箱时会 import
    # email_validator —— 缺了它，任何带 email 字段的请求都会在运行期报 ImportError
    # （不是启动时报，所以本地"能起服务"会掩盖它）。
    # 这条是补 P2-11 建 CI 时暴露的欠声明：本地 venv 里是手工装过才一直没露馅，
    # 换台机器按文档 `pip install -e ./backend` 就会在跑测试时炸出 63 个 ImportError。
    "email-validator>=2.2",
    # 数据库
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    # 队列与缓存
    "celery>=5.4",
    "redis>=5.2",
    # 对象存储
    "minio>=7.2",
    # 推理引擎客户端
    "httpx>=0.27",
    "websockets>=13.1",
    # 安全
    "pyjwt>=2.10",
    "bcrypt>=4.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
# ruff 会把仓库里的 `backend/alembic/`（迁移目录）误认成本地的一手包 `alembic`，
# 于是要求把 `from alembic import op` 单独成组。声明为三方库即消除该误判。
known-third-party = ["alembic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

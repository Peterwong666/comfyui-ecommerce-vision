# ============================================================
# 提示词库 · 反向基础词（P5-08）
#
# ⚠️ 重要前提（务必先读，否则会白费功夫）：
#   反向提示词**只在 CFG > 1 时生效**。数学上 CFG=1 时
#   去噪结果 = 纯条件分支，反向分支权重为零。
#   · SDXL 链路（cfg 7~8）→ 反向词**有效**，本文件是主力手段
#   · FLUX.2 klein **蒸馏版**（4 步 / cfg=1）→ 反向词**无效果**，
#     官方模板对应的是 ConditioningZeroOut
#   → klein 链路的「反向」诉求必须改用：① 正向增强词 ② 局部重绘 ③ 人工筛选
#   依据：项目进展.md #16 验证 3（官方模板展开结论）＋ docs/sop/contracts.md §3.5
# ============================================================
schema_version: 1
pack_id: negative
name: 反向基础词
updated: 2026-09-16
# 字段同 positive.yaml；额外：
#   severity  hit=出现即判废（人工质检直接淘汰）
#             warn=影响观感，可重跑（默认）
#             soft=轻微瑕疵，可接受
#   works_on  cfg_gt_1=仅 SDXL 等 CFG>1 链路生效  cfg_1=在 CFG=1 链路仍建议保留（无害占位）
#             all=与 CFG 无关（如尺寸/水印类由后处理负责）


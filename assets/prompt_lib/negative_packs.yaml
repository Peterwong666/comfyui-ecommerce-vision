# ============================================================
# 提示词库 · 反面词包（P5-08）
# 与 negative.yaml 的区别：
#   negative.yaml      原子词条（单条可复用、可检索、可单测）
#   negative_packs.yaml 场景化组合包 —— 直接可用的一整串反向词
# 用法：工作流参数 Schema 里把整个 pack 作为 text 默认值注入
# ⚠️ 生效前提同 negative.yaml：CFG=1 的 klein 蒸馏链路下无效
# ============================================================
schema_version: 1
pack_id: negative_packs
name: 场景化负面词包
updated: 2026-09-16
#   refs      引用的原子词条 id（便于改一处、全场景生效）
#   extra     包内追加的专用词（不进原子库，避免污染通用层）

packs:
  - id: npk-001
    name: 白底主图通用
    scenes: [白底主图]
    severity: 交付默认
    refs: [neg-001, neg-002, neg-008, neg-011, neg-012, neg-013, neg-015, neg-025, neg-026, neg-027, neg-035, neg-040, neg-033]
    extra:
      - "阴影方向混乱"
      - "背景有色块或渐变断层"
      - "产品下方悬空"
    note: "V1 最常用的一包 —— 白底主图是主线场景，建议作为默认预设"
  - id: npk-002
    name: 材质特写
    scenes: [材质特写]
    severity: 交付默认
    refs: [neg-001, neg-002, neg-003, neg-006, neg-019, neg-020, neg-021, neg-013, neg-015, neg-026]
    extra:
      - "纹理被抹平"
      - "微距景深错乱"
      - "表面出现不属于该材质的划痕"
    note: "材质特写的天敌是「过度磨皮」，neg-006 必须带上"
  - id: npk-003
    name: 场景图（生活方式）
    scenes: [场景图]
    severity: 交付默认
    refs: [neg-008, neg-009, neg-011, neg-016, neg-022, neg-023, neg-035, neg-038, neg-013]
    extra:
      - "道具喧宾夺主"
      - "场景与产品品类冲突"
      - "空间关系错乱，透视不统一"
    note: "场景图失败多来自「道具抢戏」，用 neg-038 与 extra 双保险"
  - id: npk-004
    name: 氛围图（营销节点）
    scenes: [氛围图]
    severity: 交付默认
    refs: [neg-009, neg-010, neg-024, neg-021, neg-025, neg-026, neg-027]
    extra:
      - "光效盖过产品"
      - "画面过暗无法辨认产品"
      - "过饱和导致色偏"
    note: "氛围图允许更夸张，但产品必须仍可辨认 —— 这是放量的底线"
  - id: npk-005
    name: 模特图 / 上身图
    scenes: [模特图]
    severity: 交付默认
    refs: [neg-028, neg-029, neg-027, neg-030, neg-031, neg-032, neg-011, neg-015]
    extra:
      - "手指数量错误或融合"
      - "服装与身体穿插错误"
      - "肤色不均，面部蜡像感"
      - "服装结构（领口/袖口/门襟）错误"
    note: "⚠️ 人体结构是本包重点；V1 若上模特图，建议先走 golden set 人工评级"
  - id: npk-006
    name: 包装图 / 礼盒
    scenes: [包装图]
    severity: 交付默认
    refs: [neg-026, neg-027, neg-011, neg-016, neg-013, neg-001]
    extra:
      - "包装文字乱码"
      - "包装结构不合理，无法折叠"
      - "烫金工艺表现为随机亮斑"
    note: "包装上的产品名与规格一律后期加字，不要让模型画"
  - id: npk-007
    name: 服饰平铺 / 挂拍
    scenes: [白底主图, 场景图]
    severity: 交付默认
    refs: [neg-011, neg-012, neg-013, neg-014, neg-019, neg-017, neg-002]
    extra:
      - "衣领不对称"
      - "袖长不一致"
      - "面料失真，纹理方向错误"
      - "褶皱不合理"
    note: "服装品类最常见的失败是「左右不一致」，neg-017 是本包的关键"
  - id: npk-008
    name: 鞋包皮具
    scenes: [白底主图, 材质特写]
    severity: 交付默认
    refs: [neg-011, neg-013, neg-019, neg-006, neg-014, neg-017]
    extra:
      - "缝线缺失或走向错误"
      - "五金件变形"
      - "鞋底结构与目视不符"
      - "皮面出现塑料反光"
    note: "缝线是鞋包类「真假感」的第一判据 —— 缺失即判废"
  - id: npk-009
    name: 珠宝首饰
    scenes: [白底主图, 材质特写]
    severity: 交付默认
    refs: [neg-001, neg-011, neg-013, neg-019, neg-006, neg-008, neg-040]
    extra:
      - "宝石数量错误"
      - "镶嵌结构不合理"
      - "金属爪缺失"
      - "过度反光导致结构不可辨"
    note: "⚠️ 首饰形变率最高 —— 建议 V1 强制人工全检，不做自动放量"
  - id: npk-010
    name: 食品饮品
    scenes: [场景图, 白底主图]
    severity: 交付默认
    refs: [neg-006, neg-011, neg-020, neg-009, neg-001, neg-013]
    extra:
      - "食物造型不可食用感"
      - "水珠形态不自然"
      - "食材出现非该品类的元素"
    note: "食品类「食欲感」优先，但形状必须正确 —— 二者常冲突，需按品类调权重"
  - id: npk-011
    name: 3C 数码
    scenes: [白底主图, 材质特写]
    severity: 交付默认
    refs: [neg-011, neg-012, neg-013, neg-014, neg-015, neg-019, neg-016, neg-026]
    extra:
      - "接口数量或位置错误"
      - "按键排列错误"
      - "屏幕内容乱码"
      - "边长比例失真"
    note: "3C 的失败几乎全是「结构谎言」—— neg-013/014 是本包核心"
  - id: npk-012
    name: 家居大件
    scenes: [场景图, 白底主图]
    severity: 交付默认
    refs: [neg-011, neg-016, neg-022, neg-023, neg-035, neg-012]
    extra:
      - "家具腿数量错误"
      - "结构无法承重感"
      - "与地面接触关系错误"
    note: "大件家具优先用 ControlNet 结构控制，反向词只是兜底"
  - id: npk-013
    name: 透明/半透明产品（玻璃、亚克力）
    scenes: [白底主图, 材质特写]
    severity: 交付默认
    refs: [neg-015, neg-019, neg-021, neg-011, neg-040, neg-001]
    extra:
      - "透明材质表现为实心"
      - "内部结构错乱，出现不存在的零件"
      - "折射导致背景纹理穿入产品"
    note: "⚠️ 透明件最易出现「内部凭空长出结构」，请把 neg-013 也一并加入"
  - id: npk-014
    name: 多图一致性好品兜底（跨批次）
    scenes: [全部]
    severity: 建议常驻
    refs: [neg-011, neg-012, neg-017, neg-019, neg-008, neg-001]
    extra:
      - "同一批画面风格不一致"
      - "光线方向与上一张不同"
      - "产品颜色与上一张不一致"
    note: "一致性靠「固定 seed + 固定光影词 + 固定负面词包」三件套，本包是第三件"
  - id: npk-015
    name: 极简（白底无背景阴影）
    scenes: [白底主图]
    severity: 平台特化
    refs: [neg-035, neg-036, neg-039, neg-026, neg-025, neg-011]
    extra:
      - "任何可见道具"
      - "背景纹理"
    note: "⚠️ 不要同时加 neg-018（无支撑）—— 本包追求的就是「悬浮无影」，二者冲突"
  - id: npk-016
    name: 最小包（显存/速度敏感时）
    scenes: [全部]
    severity: 加速用
    refs: [neg-001, neg-011, neg-015, neg-026, neg-030]
    extra: []
    note: "⚠️ token 预算紧张时的折衷 —— 覆盖率明显下降，仅用于草稿出图与参数扫描"

    params: {steps: 4, cfg: 1.0}
    slots:
      subject: [pos-009]
      attribute: [pos-052, pos-047]
      material: [mat-016]
      light: [lig-004, lig-029]
      composition: [cmp-001, cmp-030]
      style: [sty-002, sty-006]
      negative: npk-001
    template: "{subject}，{material}，{attribute}，{style}，{light}，{composition}，产品摄影级画质"
    notes: "渐变背景要注意 neg-010 色带断层"

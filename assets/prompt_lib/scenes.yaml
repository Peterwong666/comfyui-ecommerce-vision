# ============================================================
# 提示词库 · 电商场景配方（P5-08）
# 定位：把「原子词条」组装成可直接投产的完整配方。
#       P3-10 参数模板库（assets/prompt_lib/templates/）将按本文件落地为工作流预设。
# 结构：每个配方 = 槽位（引用原子词条 id）+ 拼装模板 + 建议参数 + 踩坑提示
# ============================================================
schema_version: 1
pack_id: scenes
name: 电商场景配方
updated: 2026-09-16

# ---------- 槽位约定（所有配方共用） ----------
#   subject      主体词（必填，1 条）        → positive.yaml  priority=1
#   attribute    属性/形态词（1-2 条）        → positive.yaml  priority=2
#   material     材质词（0-2 条，特写场景必填）→ material.yaml
#   light        光影词（1-3 条）             → light.yaml
#   composition  构图词（1-2 条）             → composition.yaml
#   style        风格词（1-2 条）             → style.yaml
#   negative     反面词包（1 个）             → negative_packs.yaml
#
# 拼装顺序（重量级从左到右递减，靠前权重更高）：
#   subject → material → style → light → composition → 画质兜底词
# ⚠️ 全场景固定保留 pos-055 / pos-061 两条画质兜底词在末尾
slots_contract:
  order: [subject, material, style, light, composition, quality_tail]
  quality_tail: [pos-055, pos-061]
  max_terms: 12
  note: "**上限 12 条是实测建议**（词条过多 → 主体不保真）。注意：该现象的机制解释**未经验证**，本文件不写未证机制 —— 详见 prompt_guide.md §2.2"

# ============================================================
# ⚠️ 槽位在各链路上的**生效性**（机器可读；依据 debug_log.md G7 与 B 流答复）
# ============================================================
# 为什么必须写在这里：配方声明了槽位，不等于槽位在目标链路上有效。
# 若不写明，下游（A 流的注入逻辑 / D 流的表单）会照单全收，
# 出现「用户填了却毫无作用」的"看起来能用"陷阱。
negative_policy:
  by_workflow:
    t2i_v1:
      effective: true
      reason: "SD1 tokenizer 未 disable → 反向提示词正常解析，且 Schema 暴露了该入口"
    flux2_klein_t2i_v1:
      effective: false
      exposed: false              # ⚠️ 关键：不是"填了不生效"，而是 Schema 里**根本没有该字段**
      reason: "① 图上官方 Distilled 子图用 ConditioningZeroOut 把负向整体置零；② 该工作流的参数 Schema 未暴露 negative_prompt 字段"
  consequence:
    - "**配方里的 `negative` 槽位在 klein 链路上不要注入、也不要提示用户可填** —— 该槽位对这些配方的作用是**人工质检清单**（`negative.yaml` 的 `severity: hit` 条目即判废标准）"
    - "**不要为 klein 的 Schema 补 `negative_prompt` 字段** —— 补了会让用户误以为能生效（`prompt_guide.md` §1 约束 2）"
    - "配方仍保留 `negative` 引用，因为它同时服务于 `t2i_v1` 场景与人工质检；下游按 `by_workflow` 决定是否注入"

# ⚠️ 权重语法禁用（同属"生效性"，与槽位无关但必须与配方一起读）
weight_syntax_policy:
  t2i_v1: "allowed —— 核心 CLIPTextEncode 正常解析 `(word:1.2)`"
  flux2_klein_t2i_v1: "FORBIDDEN —— KleinTokenizer 显式 disable_weights=True，写法会**污染**提示词（不是「无效」，是「有害」）"
  library_status: "本库全部 YAML 已正则扫过：**无任何 `(word:1.2)` 写法**，故无正在受损的内容"
  # ⚠️ 只写「严禁」是不够的 —— 用户会不知道该怎么改。必须同时给替代写法。
  substitute_technique:
    rule: "**不写权重语法，改用陈述句把「强调」表达出来**"
    examples:
      - from: "(white mug:1.5)"
        to: "a prominently featured white mug"
      - from: "(background:0.6)"
        to: "a simple uncluttered background"
      - from: "(logo:1.8)"
        to: "the brand mark clearly visible and prominent"
    why: "① 权重语法在 klein 上会作为**字面 token** 进入模型（污染）② 陈述句在两条链路上都有效，**且可读、可审查、可统计** ③ 与 §2.2 的「增删词条」调优策略一致"
    applies: "klein（默认禁用权重）下的**唯一**调优途径；SDXL 上两种写法都可用，但陈述句同样更利于配方复用"
  evidence: "docs/sop/debug_log.md G7（源码级定论）+ docs/sop/prompt_guide.md §1.1 / §1.1.1"

# ---------- 建议工作流与参数 ----------
# ⚠️ `workflow` 取值必须是 `workflows/registry.yaml` 里**已定义**的 id，本文件不自造名字。
#    当前可引用（2026-09-16 与 B 流对账）：
#      · t2i_v1               SDXL 1.0 文生图（cfg>1 → **反向词有效**）
#      · flux2_klein_t2i_v1   FLUX.2 klein 4B 蒸馏版（4 步 / cfg=1 → **反向词无效**）
#    另有 5 条在 registry 的 `planned` 段（i2i_v1 / upscale_v1 / inpaint_v1 /
#    style_transfer_v1 / batch_v1）**尚未编写定义文件，暂不可引用** ——
#    待它们落地后再为本文件补对应的配方。
#
# flux2_klein  = FLUX.2 klein 4B 蒸馏版：4 步 / cfg=1（反向词无效）
# t2i_v1       = SDXL 1.0：25-30 步 / cfg 7-8（反向词有效）
recipes:
  - id: rc-001
    name: 白底主图 · 标准
    desc: 平台主图，主体占比大、无背景、带接触阴影

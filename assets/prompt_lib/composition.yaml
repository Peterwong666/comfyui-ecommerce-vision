  - id: cmp-023
    text: "左侧留白，主体偏右"
    text_en: "left negative space, subject on the right"
    tags: [构图, 电商, 文案位]
    scenes: [场景图, 氛围图]
    priority: 2
  - id: cmp-024
    text: "成套排列，主次分明"

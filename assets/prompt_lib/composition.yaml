    scenes: [白底主图]
    priority: 1
    note: "主流电商平台主图要求主体占比较大，建议 65%-80%"
  - id: cmp-002
    text: "主体占画面 50%，四周留白"
    text_en: "subject about 50% of frame with even margin"
    tags: [构图, 占比, 留白]
    scenes: [白底主图, 场景图]
    priority: 2
  - id: cmp-003
    text: "主体贴近画面，特写占比"
    text_en: "tight crop, subject filling the frame"
    tags: [构图, 占比, 特写]
    scenes: [材质特写, 白底主图]
    priority: 2
  - id: cmp-004
    text: "主体偏小，环境为主"
    text_en: "small subject in a wide environment"
    tags: [构图, 占比, 远景]
    scenes: [氛围图, 场景图]
    priority: 3
    note: "⚠️ 不适合主图 —— 主体过小会降低点击率"


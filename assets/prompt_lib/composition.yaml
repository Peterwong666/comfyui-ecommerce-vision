schema_version: 1
pack_id: composition
name: 构图词包
updated: 2026-09-16

entries:
  # ---------- 主体占比（主图合规的硬约束） ----------
  - id: cmp-001
    text: "主体占画面 70%，居中"
    text_en: "subject filling about 70% of frame, centered"
